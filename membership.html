<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false, step: 1, picks: ['Gym floor'], name: '', cc: '+91', phone: '', email: '', visit: 'Morning', intMsg: '', nameMsg: '', phoneMsg: '', emailMsg: '' };
  }
  renderVals() {
    var self = this, st = this.state;
    
function phoneOk(cc, v) { var d = (v || '').replace(/\D/g, ''); return cc === '+91' ? d.length === 10 : (d.length >= 6 && d.length <= 14); }
function emailOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((v || '').trim()); }

    var all = ['Gym floor', 'Personal training', 'Swimming pool', 'MMA', 'Group classes', 'Kids gym', 'Rehab &amp; physio', 'Family membership'].map(function (x) { return x.replace('&amp;', '&'); });
    var labels = ['Interests', 'Your details', 'Done'];
    return {
      menuOpen: this.state.menu, toggleMenu: () => this.setState({ menu: !this.state.menu }), closeMenu: () => this.setState({ menu: false }),
      s1: st.step === 1, s2: st.step === 2, s3: st.step === 3,
      steps: labels.map(function (l, i) { return { label: (i + 1) + '. ' + l, reached: st.step >= i + 1, ahead: st.step < i + 1, current: st.step === i + 1 ? 'step' : 'false' }; }),
      interests: all.map(function (x) { var on = st.picks.indexOf(x) >= 0; return { label: x, on: on, off: !on, pick: function () { var p = st.picks.slice(); var k = p.indexOf(x); if (k >= 0) p.splice(k, 1); else p.push(x); self.setState({ picks: p, intMsg: '' }); } }; }),
      visits: ['Morning', 'Afternoon', 'Evening', 'Weekend'].map(function (v) { return { label: v, on: st.visit === v, off: st.visit !== v, pick: function () { self.setState({ visit: v }); } }; }),
      intMsg: st.intMsg,
      name: st.name, cc: st.cc, phone: st.phone, email: st.email,
      nameMsg: st.nameMsg, phoneMsg: st.phoneMsg, emailMsg: st.emailMsg, nameErr: !!st.nameMsg, phoneErr: !!st.phoneMsg, emailErr: !!st.emailMsg,
      firstName: (st.name || '').trim().split(' ')[0], summary: st.picks.join(', '), visitLabel: st.visit.toLowerCase(),
      on_name: function (e) { self.setState({ name: e.target.value, nameMsg: '' }); },
      on_email: function (e) { self.setState({ email: e.target.value, emailMsg: '' }); },
      onCc: function (e) { self.setState({ cc: e.target.value }); },
      onPhone: function (e) { self.setState({ phone: e.target.value, phoneMsg: '' }); },
      next: function () { if (!st.picks.length) { self.setState({ intMsg: 'Pick at least one option to continue.' }); return; } self.setState({ step: 2 }); },
      back: function () { self.setState({ step: 1 }); },
      restart: function () { self.setState({ step: 1, picks: [], name: '', phone: '', email: '' }); },
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        if (st.step !== 2) return;
        var nm = (st.name || '').trim().length < 2 ? 'Please enter your name.' : '';
        var pm = phoneOk(st.cc, st.phone) ? '' : 'Enter a valid phone number.';
        var em = st.email && !emailOk(st.email) ? 'That email doesn’t look right.' : '';
        if (nm || pm || em) { self.setState({ nameMsg: nm, phoneMsg: pm, emailMsg: em }); return; }
        self.setState({ step: 3 });
      }
    };
  }
}
dcMount(Component);
</script>
