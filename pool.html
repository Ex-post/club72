<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '', cc: '+91', phone: '', time: 'Morning', nameMsg: '', phoneMsg: '', done: false, open: 0 };
  }
  renderVals() {
    var self = this, st = this.state;
    
function phoneOk(cc, v) { var d = (v || '').replace(/\D/g, ''); return cc === '+91' ? d.length === 10 : (d.length >= 6 && d.length <= 14); }
function emailOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((v || '').trim()); }

    var faqs = [
      ['What are the pool operating hours?', 'The swimming pool is open daily from 7:00 AM to 9:00 PM. It stays closed every Thursday for comprehensive cleaning and maintenance.'],
      ['What is the dress code and hygiene policy?', 'All members must wear appropriate swimwear and shower before entering the pool. Access may be refused to anyone with open wounds, infections or communicable diseases.'],
      ['Is the pool safe for children?', 'Yes, it is a family-friendly environment. For safety, children under 8 years of age are not permitted. Diving is strictly prohibited; always use the steps to enter.'],
      ['Is there a lifeguard on duty?', 'Professional staff are present to keep the environment secure and run swimming lessons. Members use the pool and wet areas at their own risk and should stop swimming immediately if they feel dizzy, faint or uncomfortable.'],
      ['Can I bring guests or outside food?', 'The pool is reserved for Club 72 Gym members and authorised guests. Glassware, breakable containers and pets are not allowed in the pool area. Enjoy post-swim meals and drinks at the on-site Health Cafe.']
    ];
    return {
      name: st.name, cc: st.cc, phone: st.phone,
      nameMsg: st.nameMsg, phoneMsg: st.phoneMsg, nameErr: !!st.nameMsg, phoneErr: !!st.phoneMsg,
      done: st.done, showForm: !st.done,
      firstName: (st.name || '').trim().split(' ')[0],
      timeLabel: st.time.toLowerCase(),
      on_name: function (e) { self.setState({ name: e.target.value, nameMsg: '' }); },
      onCc: function (e) { self.setState({ cc: e.target.value }); },
      onPhone: function (e) { self.setState({ phone: e.target.value, phoneMsg: '' }); },
      times: ['Morning', 'Evening', 'Weekend'].map(function (t) { return { label: t, on: st.time === t, off: st.time !== t, pick: function () { self.setState({ time: t }); } }; }),
      faqs: faqs.map(function (f, i) { return { num: '0' + (i + 1), q: f[0], a: f[1], id: 'faq-' + i, open: st.open === i, closed: st.open !== i, toggle: function () { self.setState({ open: st.open === i ? -1 : i }); } }; }),
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var nm = (st.name || '').trim().length < 2 ? 'Please enter your name.' : '';
        var pm = phoneOk(st.cc, st.phone) ? '' : 'Enter a valid phone number.';
        if (nm || pm) { self.setState({ nameMsg: nm, phoneMsg: pm }); return; }
        self.setState({ done: true });
      },
      reset: function () { self.setState({ done: false, name: '', phone: '' }); }
    };
  }
}
dcMount(Component);
</script>
