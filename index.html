<style>
body{margin:0;background:#0B0B0C;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#ffffff;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}
button,input,select{font-family:inherit}button{cursor:pointer}
input,select{font-size:16px}
:focus-visible{outline:3px solid #EC2C3B;outline-offset:3px}

@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes reelUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes reelDown{from{transform:translateY(-50%)}to{transform:translateY(0)}}
@keyframes marqL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes marqR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 10px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
@keyframes ripple{from{transform:translate(-50%,-50%) scale(.2);opacity:.9}to{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes slash{from{clip-path:polygon(0 0,0 0,0 100%,0 100%)}to{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
@keyframes scrollcue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ln{display:block;overflow:hidden;padding-bottom:.04em}
.ln>span{display:block;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.fu{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both}
.spin{animation:spin 22s linear infinite}
.reel-up{animation:reelUp 38s linear infinite}
.reel-down{animation:reelDown 44s linear infinite}
.mq-l{animation:marqL 32s linear infinite}
.mq-r{animation:marqR 40s linear infinite}
.bar{transform-origin:left;animation:grow 1.8s cubic-bezier(.2,.8,.2,1) both}
.live{animation:pulse 2s infinite}
.rip{animation:ripple 4.5s cubic-bezier(.2,.6,.3,1) infinite}
.wv1{animation:wave 14s linear infinite}
.wv2{animation:wave 22s linear infinite reverse}
.slash{animation:slash 1.4s cubic-bezier(.7,0,.2,1) .2s both}
.cue{animation:scrollcue 2.2s ease-in-out infinite}
.float{animation:float 5s ease-in-out infinite}
.btn-red{transition:background .25s,transform .25s}
.btn-red:hover{background:#B3121F;opacity:1;transform:translateY(-2px)}
.btn-red .arr{transition:transform .3s}
.btn-red:hover .arr{transform:translateX(4px) rotate(-45deg)}
.chip{transition:background .25s,color .25s,border-color .25s}
.chip:hover{background:#EC2C3B;border-color:#EC2C3B;color:#ffffff;opacity:1}
.zones{display:flex;gap:10px}
.zone{position:relative;flex:1 1 0;min-width:0;border-radius:22px;overflow:hidden;color:#fff;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1)}
.zone img{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.zone .zd{opacity:0;transform:translateY(24px);transition:opacity .45s,transform .6s}
.zone .zv{opacity:1;transition:opacity .3s}
.zone.open,.zone:hover,.zone:focus-visible{flex-grow:5;opacity:1}
.zones:hover .zone.open:not(:hover){flex-grow:1}
.zone.open .zd,.zone:hover .zd,.zone:focus-visible .zd{opacity:1;transform:none;transition-delay:.25s}
.zones:hover .zone.open:not(:hover) .zd{opacity:0;transform:translateY(24px);transition-delay:0s}
.zone.open .zv,.zone:hover .zv,.zone:focus-visible .zv{opacity:0}
.zones:hover .zone.open:not(:hover) .zv{opacity:1}
.zone:hover img,.zone.open img{transform:scale(1.06)}
.outline{color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.55)}
@media (prefers-reduced-motion: reduce){
.ln>span,.fu,.bar,.slash{animation:none!important;opacity:1!important;transform:none!important;clip-path:none!important}
.spin,.reel-up,.reel-down,.mq-l,.mq-r,.live,.rip,.wv1,.wv2,.cue,.float{animation:none!important}
.zone,.zone img,.zone .zd{transition:none!important}
}


html,body{overflow-x:hidden}
.root{width:100%;overflow-x:clip}
.px{padding-left:clamp(20px,4.5vw,80px);padding-right:clamp(20px,4.5vw,80px)}

.hero-status{position:relative;z-index:2;display:flex;align-items:center;flex-wrap:wrap;gap:14px 32px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14);width:min(780px,58%)}
.nav-d{display:flex}
.menu-btn{display:none}
.split{display:flex;gap:clamp(24px,5vw,72px)}
.split-media{position:relative;flex-shrink:0;border-radius:28px;overflow:hidden}
.stats{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:clamp(24px,3.5vw,48px)}
.zones{height:580px}
.cb-row{display:flex;gap:10px;background:#fff;border-radius:999px;padding:6px}
.foot-nav{display:grid;grid-template-columns:repeat(4,auto);gap:14px 48px}
.mbar{display:none}
.row-wrap{display:flex;flex-wrap:wrap}
@media (max-width:1100px){
.nav-d{display:none}
.menu-btn{display:flex}
.hero-reels{width:100%;opacity:.45;padding:0}
.hero-fade{width:100%;background:linear-gradient(180deg,rgba(11,11,12,.85) 0%,rgba(11,11,12,.55) 40%,rgba(11,11,12,.9) 100%)}
.hero-copy{width:100%}
.hero-status{width:100%}
.badge{left:auto;right:24px;top:auto;bottom:120px;width:112px;height:112px}
.badge svg{width:112px;height:112px}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.zones{height:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.zone{height:340px}
.zone .zd{opacity:1!important;transform:none!important}
.zone .zv{display:none}
.zone.open,.zone:hover{flex-grow:1}
.foot-nav{grid-template-columns:repeat(3,auto)}
}
@media (max-width:860px){
.split{flex-direction:column}
.split-media{width:100%!important;height:340px;min-height:0!important}
.cue-wrap{display:none!important}
}
@media (max-width:640px){
.hero{min-height:auto;padding-bottom:24px}
.badge{display:none}
.enq-top{display:none!important}
.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 20px}
.zones{grid-template-columns:minmax(0,1fr)}
.zone{height:300px}
.cb-row{flex-wrap:wrap;border-radius:24px}
.cb-row input{flex-basis:60%}
.cb-row button{flex-basis:100%}
.foot-nav{grid-template-columns:repeat(2,auto);gap:14px 32px}
.mbar{display:grid;position:sticky;bottom:0;z-index:40;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(11,11,12,.92);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.12)}
.hide-sm{display:none!important}
.hero h1{font-size:min(96px,calc((100vw - 40px) / 5.3))!important}
}
@media (hover:none){
.zone .zd{opacity:1!important;transform:none!important}
.zone .zv{display:none}
}

</style>
</head>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false, p: 0, now: Date.now(), cc: '+91', phone: '', msg: '', invalid: false, done: false };
  }
  componentDidMount() {
    var self = this;
    var reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ p: 1 }); }
    else {
      var start = null, dur = 2200, delay = 300;
      var step = function (ts) {
        if (start === null) start = ts + delay;
        var t = Math.min(1, Math.max(0, (ts - start) / dur));
        self.setState({ p: 1 - Math.pow(1 - t, 3) });
        if (t < 1) self.raf = requestAnimationFrame(step);
      };
      this.raf = requestAnimationFrame(step);
    }
    this.clock = setInterval(function () { self.setState({ now: Date.now() }); }, 60000);
  }
  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.clock) clearInterval(this.clock);
  }
  renderVals() {
    var self = this, st = this.state;
    var d = new Date(st.now);
    var ist = new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 330 * 60000);
    var day = ist.getDay(), mins = ist.getHours() * 60 + ist.getMinutes();
    function fmt(m) { var h = Math.floor(m / 60), mm = m % 60, ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + (mm ? ':' + (mm < 10 ? '0' : '') + mm : '') + ' ' + ap; }
    function gymHours(dd) { return dd === 0 ? [720, 1260] : [360, 1410]; }
    function poolHours(dd) { return dd === 4 ? null : [420, 1260]; }
    function status(name, fn) {
      var h = fn(day);
      if (h && mins >= h[0] && mins < h[1]) return { name: name, open: true, closed: false, text: 'Open now until ' + fmt(h[1]) };
      if (h && mins < h[0]) return { name: name, open: false, closed: true, text: 'Opens today at ' + fmt(h[0]) };
      for (var i = 1; i <= 7; i++) {
        var nd = (day + i) % 7, nh = fn(nd);
        if (nh) return { name: name, open: false, closed: true, text: (i === 1 ? 'Opens tomorrow at ' : 'Opens ' + ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][nd] + ' at ') + fmt(nh[0]) + (day === 4 && fn === poolHours ? ' (closed Thursdays)' : '') };
      }
      return { name: name, open: false, closed: true, text: 'Closed' };
    }
    var p = st.p;
    return {
      menuOpen: st.menu,
      toggleMenu: function () { self.setState({ menu: !st.menu }); },
      closeMenu: function () { self.setState({ menu: false }); },
      nArea: Math.round(100000 * p).toLocaleString('en-IN'),
      nZones: Math.round(8 * p),
      nMachines: Math.round(150 * p),
      nStrength: Math.round(90 * p),
      gym: status('Gym', gymHours),
      pool: status('Pool', poolHours),
      cc: st.cc, phone: st.phone, msg: st.msg, invalid: st.invalid, done: st.done, showForm: !st.done,
      onCc: function (e) { self.setState({ cc: e.target.value }); },
      onPhone: function (e) { self.setState({ phone: e.target.value, msg: '', invalid: false }); },
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var dg = (st.phone || '').replace(/\D/g, '');
        var ok = st.cc === '+91' ? dg.length === 10 : (dg.length >= 6 && dg.length <= 14);
        if (!ok) { self.setState({ invalid: true, msg: st.cc === '+91' ? 'Enter a valid 10-digit mobile number.' : 'Enter a valid phone number.' }); return; }
        self.setState({ done: true });
      }
    };
  }
}
dcMount(Component);
</script>
