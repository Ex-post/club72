<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '', cc: '+91', phone: '', level: 'Beginner', goal: 'Fitness', nameMsg: '', phoneMsg: '', done: false };
  }
  renderVals() {
    var self = this, st = this.state;
    
function phoneOk(cc, v) { var d = (v || '').replace(/\D/g, ''); return cc === '+91' ? d.length === 10 : (d.length >= 6 && d.length <= 14); }
function emailOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((v || '').trim()); }

    function group(opts, key) { return opts.map(function (o) { return { label: o, on: st[key] === o, off: st[key] !== o, pick: function () { var u = {}; u[key] = o; self.setState(u); } }; }); }
    return {
      name: st.name, cc: st.cc, phone: st.phone, nameMsg: st.nameMsg, phoneMsg: st.phoneMsg, nameErr: !!st.nameMsg, phoneErr: !!st.phoneMsg,
      done: st.done, showForm: !st.done, firstName: (st.name || '').trim().split(' ')[0],
      levelLabel: st.level.toLowerCase(), goalLabel: st.goal.toLowerCase(),
      levels: group(['Beginner', 'Intermediate', 'Advanced'], 'level'),
      goals: group(['Fitness', 'Self-defence', 'Competition'], 'goal'),
      on_name: function (e) { self.setState({ name: e.target.value, nameMsg: '' }); },
      onCc: function (e) { self.setState({ cc: e.target.value }); },
      onPhone: function (e) { self.setState({ phone: e.target.value, phoneMsg: '' }); },
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var nm = (st.name || '').trim().length < 2 ? 'Please enter your name.' : '';
        var pm = phoneOk(st.cc, st.phone) ? '' : 'Enter a valid phone number.';
        if (nm || pm) { self.setState({ nameMsg: nm, phoneMsg: pm }); return; }
        self.setState({ done: true });
      }
    };
  }
}
dcMount(Component);
</script>
