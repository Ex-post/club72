<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '', email: '', message: '', nameMsg: '', emailMsg: '', done: false };
  }
  renderVals() {
    var self = this, st = this.state;
    
function phoneOk(cc, v) { var d = (v || '').replace(/\D/g, ''); return cc === '+91' ? d.length === 10 : (d.length >= 6 && d.length <= 14); }
function emailOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((v || '').trim()); }

    return {
      name: st.name, email: st.email, message: st.message,
      nameMsg: st.nameMsg, emailMsg: st.emailMsg, nameErr: !!st.nameMsg, emailErr: !!st.emailMsg,
      done: st.done, showForm: !st.done, firstName: (st.name || '').trim().split(' ')[0], emailShown: st.email,
      on_name: function (e) { self.setState({ name: e.target.value, nameMsg: '' }); },
      on_email: function (e) { self.setState({ email: e.target.value, emailMsg: '' }); },
      on_message: function (e) { self.setState({ message: e.target.value }); },
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var nm = (st.name || '').trim().length < 2 ? 'Please enter your name.' : '';
        var em = emailOk(st.email) ? '' : 'Enter a valid email address.';
        if (nm || em) { self.setState({ nameMsg: nm, emailMsg: em }); return; }
        self.setState({ done: true });
      },
      reset: function () { self.setState({ done: false, name: '', email: '', message: '' }); }
    };
  }
}
dcMount(Component);
</script>
